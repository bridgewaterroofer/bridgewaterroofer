<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLifespan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="50%" stop-color="#0f2642" />
      <stop offset="100%" stop-color="#071322" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Bar Gradients -->
    <linearGradient id="bar3Tab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="barArch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="barDesigner" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7e22ce" />
    </linearGradient>
    <linearGradient id="barMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="barSlate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <pattern id="meshPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>

    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgLifespan)" />
  <rect width="1200" height="675" fill="url(#meshPattern)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#accentOrange)" />

  <!-- Header Category Badge -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="195" height="28" rx="14" fill="#f97316" fill-opacity="0.15" stroke="#f97316" stroke-opacity="0.4" stroke-width="1" />
    <text x="98" y="19" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">LIFECYCLE BENCHMARK</text>
    <text x="215" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500">Bridgewater Roofer • Somerset County Durability Study</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Average Roof Lifespans in New Jersey</text>
    <text x="0" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="400">Real-world performance by roofing material subject to Central NJ freeze-thaw cycles and nor'easters</text>
  </g>

  <!-- MAIN COMPARISON CHART CONTAINER -->
  <g transform="translate(60, 175)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="720" height="425" rx="16" fill="#111f36" stroke="#1e3250" stroke-width="1.5" />
    
    <!-- Chart Header -->
    <text x="30" y="40" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="700">Material Lifespan Benchmark (Years in NJ Climate)</text>
    
    <!-- Timeline Axis Marks -->
    <g transform="translate(190, 65)">
      <line x1="0" y1="0" x2="480" y2="0" stroke="#334155" stroke-width="1" />
      <text x="0" y="-8" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">0 yrs</text>
      <text x="120" y="-8" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">20 yrs</text>
      <text x="240" y="-8" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">40 yrs</text>
      <text x="360" y="-8" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">60 yrs</text>
      <text x="480" y="-8" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="middle">80+ yrs</text>

      <line x1="120" y1="0" x2="120" y2="330" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="240" y1="0" x2="240" y2="330" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="360" y1="0" x2="360" y2="330" stroke="#1e293b" stroke-dasharray="4 4" />
      <line x1="480" y1="0" x2="480" y2="330" stroke="#1e293b" stroke-dasharray="4 4" />
    </g>

    <!-- BAR 1: 3-Tab Shingles -->
    <g transform="translate(30, 95)">
      <text x="0" y="24" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">3-Tab Asphalt</text>
      <rect x="160" y="8" width="96" height="24" rx="4" fill="url(#bar3Tab)" />
      <text x="266" y="25" fill="#94a3b8" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">12 – 16 yrs</text>
    </g>

    <!-- BAR 2: Architectural Shingles -->
    <g transform="translate(30, 155)">
      <text x="0" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">Architectural (HDZ)</text>
      <rect x="160" y="8" width="168" height="24" rx="4" fill="url(#barArch)" />
      <text x="338" y="25" fill="#38bdf8" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="800">22 – 28 yrs</text>
      <rect x="420" y="8" width="80" height="24" rx="4" fill="#0369a1" fill-opacity="0.3" />
      <text x="460" y="24" fill="#38bdf8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">NJ STANDARD</text>
    </g>

    <!-- BAR 3: Premium Designer Shingles -->
    <g transform="translate(30, 215)">
      <text x="0" y="24" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">Designer Shingles</text>
      <rect x="160" y="8" width="220" height="24" rx="4" fill="url(#barDesigner)" />
      <text x="390" y="25" fill="#c084fc" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">30 – 38 yrs</text>
    </g>

    <!-- BAR 4: Standing Seam Metal -->
    <g transform="translate(30, 275)">
      <text x="0" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">Standing Seam Metal</text>
      <rect x="160" y="8" width="370" height="24" rx="4" fill="url(#barMetal)" />
      <text x="540" y="25" fill="#4ade80" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="800">50 – 70+ yrs</text>
    </g>

    <!-- BAR 5: Natural Slate / Tile -->
    <g transform="translate(30, 335)">
      <text x="0" y="24" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">Slate / Synthetic Tile</text>
      <rect x="160" y="8" width="460" height="24" rx="4" fill="url(#barSlate)" />
      <text x="630" y="25" fill="#fbbf24" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="700">75 – 100+ yrs</text>
    </g>

    <!-- Bottom Footer Note -->
    <g transform="translate(30, 395)">
      <text x="0" y="10" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11">* Actual longevity depends heavily on balanced intake/exhaust attic ventilation and south-facing UV exposure.</text>
    </g>
  </g>

  <!-- RIGHT CARD: What Shortens Roof Life in NJ -->
  <g transform="translate(810, 175)" filter="url(#shadowBox)">
    <rect x="0" y="0" width="330" height="425" rx="16" fill="#111f36" stroke="#ea580c" stroke-opacity="0.5" stroke-width="1.5" />
    <path d="M 0 16 C 0 7.16 7.16 0 16 0 L 314 0 C 322.84 0 330 7.16 330 16 L 330 60 L 0 60 Z" fill="#7c2d12" fill-opacity="0.4" />
    <circle cx="28" cy="30" r="14" fill="#f97316" fill-opacity="0.2" />
    <text x="28" y="35" fill="#fb923c" font-family="'Outfit', system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">!</text>
    <text x="52" y="35" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="16" font-weight="700">Top 4 NJ Roof Killers</text>

    <!-- Item 1 -->
    <g transform="translate(24, 80)">
      <text x="0" y="0" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">1. Freeze-Thaw Expansion</text>
      <text x="0" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Winter meltwater seeps under shingles and expands, cracking brittle asphalt seals.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(24, 150)">
      <text x="0" y="0" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">2. Poor Attic Ventilation</text>
      <text x="0" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">140°F trapped summer attic heat bakes shingles from beneath, causing blistering.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(24, 220)">
      <text x="0" y="0" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">3. Shade &amp; Algae Retention</text>
      <text x="0" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Wooded lots in Martinsville and Warren trap moisture, encouraging destructive lichen.</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(24, 290)">
      <text x="0" y="0" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="700">4. Nor'easter Wind Fatigue</text>
      <text x="0" y="18" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Repeated 50+ mph gust cycles gradually break seal-strips, causing tab flapping.</text>
    </g>

    <!-- Bottom Action Button Graphic -->
    <g transform="translate(24, 365)">
      <rect x="0" y="0" width="282" height="38" rx="8" fill="#ea580c" />
      <text x="141" y="24" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Annual Inspections Add 5–8 Yrs</text>
    </g>
  </g>

  <!-- Bottom Comparison HUD Bar -->
  <g transform="translate(60, 620)">
    <rect x="0" y="0" width="1080" height="36" rx="8" fill="#081424" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="23" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">EXPERT VERDICT:</text>
    <text x="145" y="23" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Most Central NJ roofs are replaced at <tspan fill="#38bdf8" font-weight="700">20 to 24 years</tspan> due to thermal aging, regardless of "lifetime" marketing claims.</text>
    <text x="1056" y="23" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="end">Bridgewater Roofer Diagnostic Engineering</text>
  </g>
</svg>
