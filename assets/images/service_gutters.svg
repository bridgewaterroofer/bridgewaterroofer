<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="600" height="380">
  <defs>
    <linearGradient id="sky_gutters" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="metal_alum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="gutter_blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#sky_gutters)"/>

  <!-- Roof Eave & Fascia Board -->
  <polygon points="0,60 600,60 600,160 0,220" fill="#0F172A"/>
  <!-- Fascia Wood Board -->
  <polygon points="0,220 600,160 600,210 0,270" fill="#334155" stroke="#475569" stroke-width="2"/>

  <!-- Shingle Drip Edge Metal -->
  <polygon points="0,216 600,156 600,165 0,225" fill="#94A3B8"/>

  <!-- Seamless 6-inch K-Style Aluminum Gutter -->
  <path d="M 0,222 L 600,162 L 600,205 C 570,212 550,228 550,235 L 50,295 C 30,300 10,285 0,275 Z" fill="url(#metal_alum)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Gutter Front Lip Profile -->
  <path d="M 0,275 C 20,285 50,295 80,292 L 600,232" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

  <!-- Downspout Drop & Elbow -->
  <path d="M 460,245 L 460,320 L 510,360 L 530,350 L 485,310 L 485,240 Z" fill="url(#metal_alum)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Downspout Wall Strap -->
  <rect x="455" y="275" width="35" height="10" rx="3" fill="#64748B" stroke="#CBD5E1"/>

  <!-- Micro-Mesh Stainless Gutter Guard Screen on Top -->
  <polygon points="20,230 580,172 575,182 15,240" fill="#475569" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Water Flow Particles & Drainage Stream -->
  <g stroke="#38BDF8" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="180" x2="110" y2="230"/>
    <line x1="220" y1="160" x2="210" y2="210"/>
    <line x1="320" y1="140" x2="310" y2="190"/>
    <line x1="420" y1="120" x2="410" y2="170"/>
  </g>
  <path d="M 515,360 Q 535,375 560,370" fill="none" stroke="#38BDF8" stroke-width="4" stroke-linecap="round"/>

  <!-- Technical Spec Badge -->
  <rect x="25" y="25" width="270" height="36" rx="18" fill="rgba(15,23,42,0.92)" stroke="rgba(56,189,248,0.4)" stroke-width="1.5"/>
  <circle cx="45" cy="43" r="6" fill="#38BDF8"/>
  <text x="62" y="48" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="700">6" SEAMLESS GUTTERS &amp; GUARDS</text>
</svg>