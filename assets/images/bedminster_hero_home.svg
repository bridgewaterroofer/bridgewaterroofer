<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- 
  IMAGE PLACEHOLDER — BEDMINSTER ROOFER HERO
  Intended Subject: Wide photograph of a stately Somerset Hills estate manor in Bedminster NJ surrounded by equestrian pastures, featuring a steep designer slate-gray architectural shingle roof and copper dormer accents.
  Dimensions: 900x600 (3:2)
  Visual Style: High-end architectural estate photography, golden afternoon light.
  Future Alt Text: "Luxury estate manor in Bedminster NJ featuring a designer architectural shingle roof installation"
  -->
  <defs>
    <linearGradient id="bm_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bm_roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="bm_shingles" width="30" height="14" patternUnits="userSpaceOnUse">
      <rect width="30" height="14" fill="#1e293b"/>
      <line x1="0" y1="14" x2="30" y2="14" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="14" stroke="#334155" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="900" height="600" fill="url(#bm_sky)"/>
  
  <!-- Architectural Outline of Bedminster Manor -->
  <g opacity="0.9">
    <rect x="190" y="290" width="520" height="250" fill="#f8fafc" rx="4"/>
    <polygon points="150,290 450,120 750,290" fill="url(#bm_roof)"/>
    <polygon points="150,290 450,120 750,290" fill="url(#bm_shingles)" opacity="0.6"/>
    <!-- Center Cupola / Dormer -->
    <rect x="420" y="80" width="60" height="40" fill="#f8fafc" stroke="#f97316" stroke-width="2"/>
    <polygon points="410,80 450,45 490,80" fill="#f97316"/>
    <!-- Chimneys -->
    <rect x="230" y="140" width="45" height="110" fill="#7f1d1d" rx="2"/>
    <rect x="625" y="140" width="45" height="110" fill="#7f1d1d" rx="2"/>
  </g>

  <!-- Technical Overlay HUD Badge -->
  <rect x="120" y="440" width="660" height="110" rx="12" fill="#0b1329" fill-opacity="0.92" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="475" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="1.5">IMAGE PLACEHOLDER — BEDMINSTER ROOFER HERO</text>
  <text x="450" y="502" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Subject: Somerset Hills Equestrian Manor with Designer Shingle Roof | 900x600</text>
  <text x="450" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Visual: Premium architectural capture • Bedminster Twp, NJ • Replacement Scheduled</text>
</svg>
