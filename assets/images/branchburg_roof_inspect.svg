<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550">
  <!-- 
  IMAGE PLACEHOLDER — BRANCHBURG ROOFER INSPECTION
  Intended Subject: Roofing expert in safety harness checking roof valley seal and eave drip edges on a suburban Branchburg NJ home.
  Dimensions: 800x550 (approx 3:2)
  Visual Style: Professional field inspection photography, clear sunny daylight.
  Future Alt Text: "Roof inspector examining valley metal flashing and shingle adhesion on a Branchburg NJ home"
  -->
  <defs>
    <linearGradient id="bb_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="40%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>

  <rect width="800" height="550" fill="url(#bb_grad)"/>

  <!-- Roof Surface & Valley -->
  <polygon points="0,550 480,180 800,340 800,550" fill="#1e293b"/>
  <line x1="480" y1="180" x2="320" y2="550" stroke="#f97316" stroke-width="5"/>

  <!-- Technician Silhouette Graphic -->
  <circle cx="260" cy="300" r="22" fill="#f97316"/>
  <path d="M 240 325 L 280 325 L 290 410 L 230 410 Z" fill="#0f172a"/>
  <line x1="260" y1="325" x2="330" y2="380" stroke="#f97316" stroke-width="3" stroke-dasharray="4 2"/>

  <!-- Technical Overlay HUD Badge -->
  <rect x="80" y="410" width="640" height="105" rx="10" fill="#0b1329" fill-opacity="0.92" stroke="#f97316" stroke-width="2"/>
  <text x="400" y="445" font-family="'Outfit', sans-serif" font-size="16" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="1.5">IMAGE PLACEHOLDER — BRANCHBURG ROOF INSPECTION</text>
  <text x="400" y="472" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#e2e8f0" text-anchor="middle">Subject: Technician Evaluating Valley Flashing & Eave Underlayment | 800x550</text>
  <text x="400" y="495" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Visual: Residential diagnostics • Branchburg Township NJ • Replacement Scheduled</text>
</svg>
