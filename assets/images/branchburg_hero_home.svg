<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <!-- 
  IMAGE PLACEHOLDER — BRANCHBURG ROOFER HERO
  Intended Subject: Wide photograph of a handsome suburban colonial residence in Branchburg NJ along the North Branch corridor with a brand new dark charcoal architectural shingle roof and seamless gutters.
  Dimensions: 900x600 (3:2)
  Visual Style: Bright crisp daytime architectural photography, clean suburban lawn.
  Future Alt Text: "Suburban colonial home in Branchburg NJ featuring a newly installed architectural shingle roof"
  -->
  <defs>
    <linearGradient id="bb_sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="60%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="bb_roof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <pattern id="bb_shingles" width="30" height="14" patternUnits="userSpaceOnUse">
      <rect width="30" height="14" fill="#1e293b"/>
      <line x1="0" y1="14" x2="30" y2="14" stroke="#0f172a" stroke-width="1.5"/>
      <line x1="10" y1="0" x2="10" y2="14" stroke="#334155" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="900" height="600" fill="url(#bb_sky)"/>
  
  <!-- Architectural Outline of Branchburg Colonial -->
  <g opacity="0.9">
    <rect x="200" y="300" width="500" height="240" fill="#f8fafc" rx="4"/>
    <polygon points="160,300 450,140 740,300" fill="url(#bb_roof)"/>
    <polygon points="160,300 450,140 740,300" fill="url(#bb_shingles)" opacity="0.6"/>
    <!-- Garage Wing -->
    <rect x="650" y="360" width="160" height="180" fill="#f1f5f9"/>
    <polygon points="630,360 730,280 830,360" fill="url(#bb_roof)"/>
    <!-- Chimney -->
    <rect x="580" y="160" width="45" height="100" fill="#991b1b" rx="2"/>
  </g>

  <!-- Technical Overlay HUD Badge -->
  <rect x="120" y="440" width="660" height="110" rx="12" fill="#0b1329" fill-opacity="0.92" stroke="#f97316" stroke-width="2"/>
  <text x="450" y="475" font-family="'Outfit', sans-serif" font-size="18" font-weight="700" fill="#f97316" text-anchor="middle" letter-spacing="1.5">IMAGE PLACEHOLDER — BRANCHBURG ROOFER HERO</text>
  <text x="450" y="502" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#e2e8f0" text-anchor="middle">Subject: Contemporary Colonial with Charcoal Architectural Shingle System | 900x600</text>
  <text x="450" y="525" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Visual: Residential architectural capture • Branchburg Twp, NJ • Replacement Scheduled</text>
</svg>
