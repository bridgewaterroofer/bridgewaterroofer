<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgStorm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#111c38" />
      <stop offset="100%" stop-color="#080e1f" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#182747" />
      <stop offset="100%" stop-color="#101b33" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="stormCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="alertOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Pattern -->
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.5" fill="#38bdf8" fill-opacity="0.08" />
    </pattern>

    <filter id="cardGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bgStorm)" />
  <rect width="1200" height="675" fill="url(#dotPattern)" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#alertOrange)" />

  <!-- Header Category Badge -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="195" height="28" rx="14" fill="#fb923c" fill-opacity="0.15" stroke="#fb923c" stroke-opacity="0.4" stroke-width="1" />
    <text x="98" y="19" fill="#fb923c" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">STORM RESILIENCE PROTOCOL</text>
    <text x="215" y="20" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="500">Bridgewater Roofer • Emergency Field Guide</text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(60, 110)">
    <text x="0" y="0" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Post-Storm Roof Assessment Protocol</text>
    <text x="0" y="32" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="400">Safe ground-level and interior inspection checklist following severe New Jersey wind, rain, and hail</text>
  </g>

  <!-- SIX INSPECTION ZONES GRID -->

  <!-- Card 1: Ground-Level Binocular Scan -->
  <g transform="translate(60, 170)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="340" height="195" rx="14" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="40" cy="38" r="20" fill="#0284c7" fill-opacity="0.2" />
    <text x="40" y="44" fill="#38bdf8" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">01</text>
    <text x="75" y="42" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="17" font-weight="700">Ground Perimeter Scan</text>
    <text x="24" y="85" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500">Walk the entire yard with binoculars.</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Spot missing, torn, or folded shingles</text>
    <text x="24" y="134" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Check ridge caps along main peaks</text>
    <text x="24" y="156" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Look for shingles lying in the lawn</text>
    <rect x="24" y="172" width="292" height="6" rx="3" fill="#0369a1" />
  </g>

  <!-- Card 2: Gutter Runoff & Granule Loss -->
  <g transform="translate(430, 170)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="340" height="195" rx="14" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="40" cy="38" r="20" fill="#f97316" fill-opacity="0.2" />
    <text x="40" y="44" fill="#fb923c" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">02</text>
    <text x="75" y="42" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="17" font-weight="700">Downspouts &amp; Gutters</text>
    <text x="24" y="85" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500">Inspect drainage discharge points.</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Piles of black mineral granules indicate impact</text>
    <text x="24" y="134" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Dents on aluminum gutter troughs (hail)</text>
    <text x="24" y="156" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Detached or overflowing gutter sections</text>
    <rect x="24" y="172" width="292" height="6" rx="3" fill="#ea580c" />
  </g>

  <!-- Card 3: Collateral Clues (A/C & Siding) -->
  <g transform="translate(800, 170)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="340" height="195" rx="14" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="40" cy="38" r="20" fill="#22c55e" fill-opacity="0.2" />
    <text x="40" y="44" fill="#4ade80" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">03</text>
    <text x="75" y="42" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="17" font-weight="700">Collateral Property Clues</text>
    <text x="24" y="85" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500">Document ground-level impacts.</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Dented outdoor A/C compressor fins</text>
    <text x="24" y="134" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Cracked vinyl siding or window screens</text>
    <text x="24" y="156" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Pitted mailboxes or painted deck railings</text>
    <rect x="24" y="172" width="292" height="6" rx="3" fill="#16a34a" />
  </g>

  <!-- Card 4: Attic Underside Inspection -->
  <g transform="translate(60, 390)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="340" height="195" rx="14" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="40" cy="38" r="20" fill="#a855f7" fill-opacity="0.2" />
    <text x="40" y="44" fill="#c084fc" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">04</text>
    <text x="75" y="42" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="17" font-weight="700">Attic Interior Check</text>
    <text x="24" y="85" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500">Inspect rafters with a high-lumen flashlight.</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Water stains along plywood sheathing</text>
    <text x="24" y="134" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Damp, compressed fiberglass insulation</text>
    <text x="24" y="156" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Daylight showing through ridge or vents</text>
    <rect x="24" y="172" width="292" height="6" rx="3" fill="#9333ea" />
  </g>

  <!-- Card 5: Ceiling & Wall Drywall Scan -->
  <g transform="translate(430, 390)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="340" height="195" rx="14" fill="url(#cardGrad)" stroke="#1e3a5f" stroke-width="1.5" />
    <circle cx="40" cy="38" r="20" fill="#eab308" fill-opacity="0.2" />
    <text x="40" y="44" fill="#facc15" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">05</text>
    <text x="75" y="42" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="17" font-weight="700">Ceilings &amp; Light Fixtures</text>
    <text x="24" y="85" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500">Scan interior top-floor living areas.</text>
    <text x="24" y="112" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Yellow or brown circular water rings</text>
    <text x="24" y="134" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Bubbling or sagging paint / peeling tape</text>
    <text x="24" y="156" fill="#94a3b8" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Drips around ceiling fans or recessed lights</text>
    <rect x="24" y="172" width="292" height="6" rx="3" fill="#ca8a04" />
  </g>

  <!-- Card 6: Professional Tarp & Assessment -->
  <g transform="translate(800, 390)" filter="url(#cardGlow)">
    <rect x="0" y="0" width="340" height="195" rx="14" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="40" cy="38" r="20" fill="#f43f5e" fill-opacity="0.2" />
    <text x="40" y="44" fill="#fb7185" font-family="'Outfit', system-ui, sans-serif" font-size="18" font-weight="800" text-anchor="middle">06</text>
    <text x="75" y="42" fill="#ffffff" font-family="'Outfit', system-ui, sans-serif" font-size="17" font-weight="700">Call for Emergency Tarp</text>
    <text x="24" y="85" fill="#f43f5e" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="600">NEVER climb a wet or damaged roof.</text>
    <text x="24" y="112" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Call licensed NJ roofer for 24/7 tarping</text>
    <text x="24" y="134" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• Get timestamped date &amp; photo documentation</text>
    <text x="24" y="156" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">• File insurance claim before mitigation</text>
    <rect x="24" y="172" width="292" height="6" rx="3" fill="#e11d48" />
  </g>

  <!-- Bottom Safety HUD Callout -->
  <g transform="translate(60, 615)">
    <rect x="0" y="0" width="1080" height="40" rx="8" fill="#0f172a" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="24" cy="20" r="10" fill="#ef4444" fill-opacity="0.2" />
    <text x="24" y="24" fill="#ef4444" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">!</text>
    <text x="44" y="25" fill="#fca5a5" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700">SAFETY WARNING:</text>
    <text x="175" y="25" fill="#cbd5e1" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12">Never climb a wet roof or lean ladders against compromised guttering. Perform checks from the ground or hire a licensed contractor.</text>
    <text x="1056" y="25" fill="#64748b" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" text-anchor="end">Bridgewater Roofer 24/7 Dispatch: (908) 465-9944</text>
  </g>
</svg>
